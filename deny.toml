# cargo-deny configuration for Clio
# Run: cargo deny check

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

# ── Licenças aceitas ────────────────────────────────────────────────────────
[licenses]
version = 2
# Licenças permissivas aceitas:
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",         # Boost — tiny-skia deps
    "OFL-1.1",         # Fontes Noto / JetBrains Mono
    "EUPL-1.2",        # Licença do próprio Clio
    "Zlib",
    "LicenseRef-UFL-1.0",
]
# openh264 é BSD-2-Clause (codec de referência Cisco); aceitável.
# x264 é GPL-2.0: NÃO incluir, a menos que seja aceito explicitamente.
# Se x264enc for adicionado como fallback, adicionar "GPL-2.0-only" aqui
# E documentar a decisão em docs/licencas.md.

exceptions = [
    # Exemplo: { name = "some-crate", version = "*", allow = ["GPL-2.0-only"] }
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Bans (crates proibidos) ─────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Proibir qualquer crate de cliente de rede HTTP/HTTPS em tempo de execução.
# O Clio não deve fazer conexões de rede.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "attohttpc" },
    { name = "surf" },
    { name = "isahc" },
    # Permitir apenas se for dependência transitória de crates de crypto/TLS sem uso em runtime.
    # Se aparecer, investigar antes de adicionar exceção.
]

# ── Fontes permitidas ────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
