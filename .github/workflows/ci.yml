name: CI / Build & Verificações

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    name: Validação de Qualidade e Segurança
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain estável
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache de Dependências Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verificar Formatação (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Linter (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Executar Testes Unitários e de Integração
        run: cargo test --workspace --locked

      - name: Instalar cargo-deny
        run: cargo install cargo-deny --locked

      - name: Checagem de Licenças e Advisories (cargo deny)
        run: cargo deny check

      - name: Compilar Binário Release
        run: cargo build --release --locked -p clio-app

      - name: Instalar cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Gerar SBOM (CycloneDX JSON)
        run: cargo cyclonedx --format json --output-pattern target/clio-sbom.json

      - name: Upload Artifacts (Binário e SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: clio-release-x64
          path: |
            target/release/clio.exe
            target/clio-sbom.json
